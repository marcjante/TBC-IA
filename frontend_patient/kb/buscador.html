<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cercador TB / ITL</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231F4B4C'/%3E%3Cpath d='M10,50 L35,50 L42,30 L50,70 L58,50 L90,50' stroke='%233E8E89' stroke-width='7' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EEF3F0;
    --surface: #FFFFFF;
    --ink: #152623;
    --ink-soft: #4A5B57;
    --teal: #1F6F72;
    --teal-dark: #123F42;
    --line: #D7E0DB;
    --mark-bg: #FBF1DE;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', sans-serif;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    padding: 28px 20px 18px;
  }
  .back-link {
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    text-decoration: none;
    margin-bottom: 8px;
    transition: color 0.15s ease;
  }
  .back-link:hover { color: var(--teal-dark); }
  header h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 22px;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  header p { margin: 0; color: var(--ink-soft); font-size: 13px; }
  main { max-width: 720px; margin: 0 auto; padding: 20px 16px 60px; }
  .tb-searchbar { display: flex; gap: 8px; margin-bottom: 8px; }
  .tb-searchbar input {
    flex: 1;
    padding: 11px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    background: #fcfdfc;
    color: var(--ink);
  }
  .tb-searchbar button {
    padding: 11px 20px;
    border: none;
    border-radius: 8px;
    background: var(--teal);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
  }
  .tb-searchbar button:hover { background: var(--teal-dark); }
  #tb-status { font-size: 13px; color: var(--ink-soft); margin-bottom: 20px; }
  .tb-result {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .tb-result-meta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--teal-dark);
    font-weight: 600;
    letter-spacing: .04em;
    text-transform: uppercase;
  }
  .tb-result-title { margin: 8px 0; font-size: 15px; font-weight: 600; }
  .tb-result-snippet { font-size: 14px; line-height: 1.55; color: var(--ink); }
  .tb-result-snippet mark { background: var(--mark-bg); color: var(--ink); padding: 0 2px; border-radius: 2px; }
  .tb-result-link { font-size: 13px; color: var(--teal); text-decoration: none; font-weight: 600; }
  .tb-result-link:hover { text-decoration: underline; }
  .tb-empty { color: var(--ink-soft); text-align: center; padding: 30px 10px; font-size: 13.5px; }

  button:focus-visible, a:focus-visible, input:focus-visible {
    outline: 2px solid var(--teal-dark);
    outline-offset: 2px;
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
  @media (max-width: 480px) {
    .tb-searchbar { flex-direction: column; }
  }
</style>
</head>
<body>
  <header>
    <a href="/" class="back-link">&larr; Tornar al panell</a>
    <h1>Cercador de la base de coneixement TB / ITL</h1>
    <p>Cerca directament als documents de l'OMS, CDC, ECDC i Ministeri de Sanitat</p>
  </header>
  <main>
    <div class="tb-searchbar">
      <input id="tb-input" type="text" placeholder="Ex: durada del tractament amb isoniazida" />
      <button id="tb-button">Cercar</button>
    </div>
    <div id="tb-status">Carregant…</div>
    <div id="tb-results"></div>
  </main>

  <script src="buscador.js"></script>
  <script>
    initBuscadorTB({
      inputId: "tb-input",
      buttonId: "tb-button",
      resultsId: "tb-results",
      statusId: "tb-status",
    });
  </script>
</body>
</html>
