<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TBC-AI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231F4B4C'/%3E%3Cpath d='M10,50 L35,50 L42,30 L50,70 L58,50 L90,50' stroke='%233E8E89' stroke-width='7' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F1E8;
    --bg-panel: #FFFEFA;
    --bg-msg-user: #1F4B4C;
    --bg-msg-bot: #EFEADD;
    --text: #1C2420;
    --text-dim: #5B6560;
    --accent: #A8502E;
    --border: #DEDACB;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--bg-panel);
  }
  header h1 { font-family: 'Fraunces', serif; font-size: 19px; margin: 0; font-weight: 600; }
  header .status { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .header-actions { display: flex; gap: 8px; }
  button.icon-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
  }
  button.icon-btn:hover { background: var(--border); }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .msg {
    max-width: 75%;
    padding: 12px 16px;
    border-radius: 10px;
    line-height: 1.5;
    font-size: 14px;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--bg-msg-user);
    color: #F5F1E8;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bg-msg-bot);
  }
  .msg .sources {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-dim);
  }
  .msg .sources div { margin-bottom: 2px; }
  .msg .sources a {
    color: var(--accent);
    text-decoration: none;
  }
  .msg .sources a:hover { text-decoration: underline; }
  .msg-actions {
    margin-top: 8px;
    display: flex;
    gap: 8px;
  }
  .msg-actions button {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 11px;
    padding: 2px 6px;
  }
  .msg-actions button:hover { color: var(--text); }

  .loading { color: var(--text-dim); font-style: italic; font-size: 13px; display: flex; align-items: center; gap: 10px; }
  .loading button {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    cursor: pointer;
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 6px;
    font-style: normal;
  }
  .loading button:hover { color: var(--text); background: var(--border); }

  #upload-area {
    padding: 10px 20px;
    border-top: 1px solid var(--border);
    background: var(--bg-panel);
  }
  #dropzone {
    border: 2px dashed var(--border);
    border-radius: 8px;
    padding: 14px;
    text-align: center;
    font-size: 13px;
    color: var(--text-dim);
    transition: background 0.15s, border-color 0.15s;
  }
  #dropzone.dragover {
    background: var(--bg-msg-bot);
    border-color: var(--accent);
  }
  #file-label {
    color: var(--accent);
    cursor: pointer;
    text-decoration: underline;
  }
  #upload-status {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 6px;
    text-align: center;
  }

  #input-area {
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    background: var(--bg-panel);
    display: flex;
    gap: 10px;
  }
  #message-input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 14px;
    resize: none;
    font-family: inherit;
  }
  #send-btn {
    background: var(--accent);
    border: none;
    color: white;
    padding: 0 20px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
  }
  #send-btn:disabled { opacity: 0.5; cursor: default; }

  @media (max-width: 600px) {
    .msg { max-width: 90%; }
    header h1 { font-size: 14px; }
  }

  .back-link {
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    text-decoration: none;
    margin-bottom: 6px;
    transition: color 0.15s ease;
  }
  .back-link:hover { color: var(--accent); }

  /* Foco de teclado visible */
  button:focus-visible, a:focus-visible, textarea:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* Scrollbar mas discreto */
  #chat::-webkit-scrollbar { width: 8px; }
  #chat::-webkit-scrollbar-track { background: transparent; }
  #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  #chat::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<header>
  <div>
    <a href="/" class="back-link">&larr; Tornar al panell</a>
    <h1>TBC-AI</h1>
    <div class="status" id="status">Conectando...</div>
  </div>
  <div class="header-actions">
    <button class="icon-btn" onclick="exportChat()">Exportar</button>
    <button class="icon-btn" onclick="clearChat()">Limpiar chat</button>
  </div>
</header>

<div id="chat"></div>

<div id="upload-area">
  <div id="dropzone">
    Arrastra un PDF aqui, o
    <label for="file-input" id="file-label">selecciona un archivo</label>
    <input type="file" id="file-input" accept=".pdf" style="display:none">
  </div>
  <div id="upload-status"></div>
</div>

<div id="input-area">
  <textarea id="message-input" rows="1" placeholder="Escribe tu pregunta sobre tuberculosis..."></textarea>
  <button id="send-btn" onclick="sendMessage()">Enviar</button>
</div>

<script>
const API_URL = "";
const REQUEST_TIMEOUT_MS = 90000; // 90s: tiempo tras el cual se aborta automaticamente una peticion colgada
const HEALTH_POLL_MS = 30000; // 30s: frecuencia de comprobacion periodica del estado del backend
let history = JSON.parse(localStorage.getItem("tbc_chat_history") || "[]");
let currentAbortController = null;

function renderHistory() {
  const chatEl = document.getElementById("chat");
  chatEl.innerHTML = "";
  history.forEach(msg => appendMessageToDOM(msg.role, msg.content, msg.sources, false));
  chatEl.scrollTop = chatEl.scrollHeight;
}

function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

// Convierte enfasis simple tipo Markdown (**negrita**) generado a veces por
// el modelo en HTML seguro. El texto se escapa primero (escapeHtml) para
// evitar cualquier inyeccion, y solo despues se interpreta el patron de
// negrita sobre el texto ya escapado.
function renderInlineMarkdown(text) {
  const escaped = escapeHtml(text);
  return escaped.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
}

// Categorias que son citas bibliograficas breves (Knowledge Base JSON y
// biblioteca ampliada de Excel), sin PDF real detras — deben mostrarse como
// texto plano, nunca como enlace a un documento inexistente. Debe
// coincidir con NON_PDF_CATEGORIES en backend/main.py.
const NON_PDF_CATEGORIES = new Set(["05_ClinicalKB_JSON", "07_Biblioteca_Ampliada_253"]);

function sourceToHtml(s) {
  const label = `${escapeHtml(s.category)} — ${escapeHtml(s.source)}, p.${escapeHtml(String(s.page))}`;
  if (NON_PDF_CATEGORIES.has(s.category)) {
    return `<div>${label}</div>`;
  }
  const highlightParam = s.text ? `&highlight=${encodeURIComponent(s.text)}` : "";
  const url = `/api/document/${encodeURIComponent(s.category)}/${encodeURIComponent(s.source)}?page=${encodeURIComponent(s.page)}${highlightParam}#page=${encodeURIComponent(s.page)}`;
  return `<div><a href="${url}" target="_blank" rel="noopener noreferrer">${label}</a></div>`;
}

function appendMessageToDOM(role, content, sources, saveToHistory) {
  const chatEl = document.getElementById("chat");
  const msgEl = document.createElement("div");
  msgEl.className = "msg " + (role === "user" ? "user" : "bot");

  const textEl = document.createElement("div");
  if (role === "bot") {
    textEl.innerHTML = renderInlineMarkdown(content);
  } else {
    textEl.textContent = content;
  }
  msgEl.appendChild(textEl);

  if (sources && sources.length > 0) {
    const srcEl = document.createElement("div");
    srcEl.className = "sources";
    srcEl.innerHTML = "<strong>Fuentes:</strong><br>" + sources.map(s => sourceToHtml(s)).join("");
    msgEl.appendChild(srcEl);
  }

  if (role === "bot") {
    const actionsEl = document.createElement("div");
    actionsEl.className = "msg-actions";
    const copyBtn = document.createElement("button");
    copyBtn.textContent = "Copiar";
    copyBtn.onclick = () => {
      navigator.clipboard.writeText(content).then(() => {
        const originalText = copyBtn.textContent;
        copyBtn.textContent = "Copiado ✓";
        copyBtn.disabled = true;
        setTimeout(() => {
          copyBtn.textContent = originalText;
          copyBtn.disabled = false;
        }, 1500);
      }).catch(() => {
        copyBtn.textContent = "Error al copiar";
        setTimeout(() => { copyBtn.textContent = "Copiar"; }, 1500);
      });
    };
    actionsEl.appendChild(copyBtn);
    msgEl.appendChild(actionsEl);
  }

  chatEl.appendChild(msgEl);
  chatEl.scrollTop = chatEl.scrollHeight;

  if (saveToHistory) {
    history.push({ role, content, sources: sources || [] });
    localStorage.setItem("tbc_chat_history", JSON.stringify(history));
  }
}

async function checkHealth() {
  const statusEl = document.getElementById("status");
  try {
    const res = await fetch(API_URL + "/api/health");
    const data = await res.json();
    if (data.status === "ok") {
      statusEl.textContent = `${data.model} · ${data.documentos_indexados} fragmentos indexados`;
      statusEl.style.color = "";
    } else {
      statusEl.textContent = "Error de conexión con el backend";
      statusEl.style.color = "#A8502E";
    }
  } catch (e) {
    statusEl.textContent = "Backend no disponible (¿está corriendo uvicorn?)";
    statusEl.style.color = "#A8502E";
  }
}

async function sendMessage() {
  const input = document.getElementById("message-input");
  const message = input.value.trim();
  if (!message) return;

  const sendBtn = document.getElementById("send-btn");
  input.value = "";
  sendBtn.disabled = true;

  appendMessageToDOM("user", message, null, true);

  const chatEl = document.getElementById("chat");
  const loadingEl = document.createElement("div");
  loadingEl.className = "loading";

  const loadingText = document.createElement("span");
  loadingText.textContent = "Buscando en los documentos y generando respuesta...";
  loadingEl.appendChild(loadingText);

  const cancelBtn = document.createElement("button");
  cancelBtn.textContent = "Cancelar";
  loadingEl.appendChild(cancelBtn);

  chatEl.appendChild(loadingEl);
  chatEl.scrollTop = chatEl.scrollHeight;

  currentAbortController = new AbortController();
  cancelBtn.onclick = () => currentAbortController.abort("cancelado_por_usuario");

  // Aviso intermedio: si tarda mas de 20s, se avisa de que puede haber un
  // problema con el modelo, sin cancelar todavia (una respuesta normal
  // puede tardar 20-45s sin que eso sea un fallo).
  const slowWarningTimer = setTimeout(() => {
    loadingText.textContent = "Sigue generando la respuesta (puede tardar hasta un minuto). Si tarda mucho mas, puede que el modelo se haya quedado sin responder — puedes cancelar.";
  }, 20000);

  const hardTimeoutTimer = setTimeout(() => {
    if (currentAbortController) currentAbortController.abort("timeout");
  }, REQUEST_TIMEOUT_MS);

  try {
    const res = await fetch(API_URL + "/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message }),
      signal: currentAbortController.signal,
    });
    const data = await res.json();
    clearTimeout(slowWarningTimer);
    clearTimeout(hardTimeoutTimer);
    loadingEl.remove();
    appendMessageToDOM("bot", data.response, data.sources, true);
  } catch (e) {
    clearTimeout(slowWarningTimer);
    clearTimeout(hardTimeoutTimer);
    loadingEl.remove();
    if (e.name === "AbortError") {
      const reason = currentAbortController.signal.reason;
      if (reason === "cancelado_por_usuario") {
        appendMessageToDOM("bot", "Pregunta cancelada.", null, false);
      } else {
        appendMessageToDOM("bot", "La respuesta ha tardado demasiado y se ha cancelado automaticamente (posible problema con el modelo de IA). Comprueba que Ollama sigue activo e intentalo de nuevo.", null, true);
      }
    } else {
      appendMessageToDOM("bot", "Error al contactar con el backend: " + e.message, null, true);
    }
  }

  currentAbortController = null;
  sendBtn.disabled = false;
}

function clearChat() {
  if (confirm("¿Borrar todo el historial de conversación? Esta acción no se puede deshacer.")) {
    history = [];
    localStorage.removeItem("tbc_chat_history");
    document.getElementById("chat").innerHTML = "";
  }
}

function exportChat() {
  const text = history.map(m => {
    let block = `[${m.role === "user" ? "Usuario" : "TBC-AI"}]\n${m.content}\n`;
    if (m.sources && m.sources.length > 0) {
      block += "\nFuentes:\n" + m.sources.map(s => `- ${s.category} — ${s.source}, p.${s.page}`).join("\n") + "\n";
    }
    return block;
  }).join("\n---\n\n");
  const blob = new Blob([text], { type: "text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `tbc-ai-conversacion-${new Date().toISOString().slice(0,10)}.txt`;
  a.click();
  URL.revokeObjectURL(url);
}

async function uploadFile(file) {
  const statusEl = document.getElementById("upload-status");

  if (!file.name.toLowerCase().endsWith(".pdf")) {
    statusEl.textContent = "Solo se aceptan archivos PDF.";
    return;
  }

  statusEl.textContent = `Subiendo e indexando "${file.name}"...`;

  const formData = new FormData();
  formData.append("file", file);
  formData.append("category", "sin_categoria");

  try {
    const res = await fetch(API_URL + "/api/upload", {
      method: "POST",
      body: formData,
    });
    const data = await res.json();

    if (data.status === "ok") {
      statusEl.textContent = `"${data.filename}" indexado (${data.chunks_indexed} fragmentos). Total: ${data.total_documentos_indexados}.`;
      checkHealth();
    } else {
      statusEl.textContent = "Error: " + data.detail;
    }
  } catch (e) {
    statusEl.textContent = "Error al subir el archivo: " + e.message;
  }
}

const dropzone = document.getElementById("dropzone");
const fileInput = document.getElementById("file-input");

dropzone.addEventListener("dragover", (e) => {
  e.preventDefault();
  dropzone.classList.add("dragover");
});
dropzone.addEventListener("dragleave", () => {
  dropzone.classList.remove("dragover");
});
dropzone.addEventListener("drop", (e) => {
  e.preventDefault();
  dropzone.classList.remove("dragover");
  if (e.dataTransfer.files.length > 0) {
    uploadFile(e.dataTransfer.files[0]);
  }
});
fileInput.addEventListener("change", (e) => {
  if (e.target.files.length > 0) {
    uploadFile(e.target.files[0]);
  }
});

document.getElementById("message-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

renderHistory();
checkHealth();
setInterval(checkHealth, HEALTH_POLL_MS);
</script>

</body>
</html>
